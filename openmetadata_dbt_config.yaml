source:
  type: dbt
  serviceName: aws_redshift_service
  sourceConfig:
    config:
      type: DBT
      dbtConfigSource:
        dbtConfigType: local
        dbtCatalogFilePath: ./artifacts/catalog.json
        dbtManifestFilePath: ./artifacts/manifest.json
        dbtRunResultsFilePath: ./artifacts/run_results.json
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: $OPENMETADATA_HOST
    authProvider: openmetadata
    securityConfig:
      jwtToken: $OPENMETADATA_JWT_TOKEN