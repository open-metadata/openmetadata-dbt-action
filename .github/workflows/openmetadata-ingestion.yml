name: OpenMetadata DBT Ingestion

on:
  push:
    branches: [ main, master ]
    paths:
      - 'artifacts/**'
      - 'openmetadata_dbt_config.yaml'
      - '.github/workflows/openmetadata-ingestion.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:


jobs:
  ingest-dbt-metadata:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install OpenMetadata Ingestion
      env:
        OPENMETADATA_VERSION: ${{ secrets.OPENMETADATA_VERSION }}
      run: |
        python -m pip install --upgrade pip
        echo "Installing openmetadata-ingestion[dbt] version: $OPENMETADATA_VERSION"
        pip install "openmetadata-ingestion[dbt]==$OPENMETADATA_VERSION"

    - name: Verify DBT artifacts exist
      run: |
        echo "Checking for DBT artifacts..."
        ls -la artifacts/
        if [ ! -f artifacts/manifest.json ]; then
          echo "Error: manifest.json not found in artifacts/"
          exit 1
        fi
        echo "DBT artifacts found successfully"
    
    - name: Run OpenMetadata DBT Ingestion
      env:
        OPENMETADATA_HOST: ${{ secrets.OPENMETADATA_HOST }}
        OPENMETADATA_JWT_TOKEN: ${{ secrets.OPENMETADATA_JWT_TOKEN }}
      run: |
        echo "Starting OpenMetadata DBT ingestion..."
        metadata ingest -c openmetadata_dbt_config.yaml